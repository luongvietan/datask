name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — ruff · mypy · pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datask
          POSTGRES_PASSWORD: datask
          POSTGRES_DB: datask_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://datask:datask@localhost:5432/datask_test
      REDIS_URL: redis://localhost:6379/0
      APP_SECRET_KEY: ci-test-secret-key-32-chars-long-!
      STRIPE_SECRET_KEY: sk_test_fake
      STRIPE_WEBHOOK_SECRET: whsec_fake
      STRIPE_PRICE_PAYG_ID: price_fake

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run mypy (api + core)
        run: uv run mypy apps/api/src packages/core/src
        continue-on-error: true

      - name: Run pytest (core + api + worker)
        run: uv run pytest packages/core/tests apps/api/tests apps/worker/tests -v --cov=apps/api/src --cov=packages/core/src --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://datask:datask@localhost:5432/datask_test

  frontend:
    name: Frontend — tsc · eslint · vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0
        working-directory: apps/web
        continue-on-error: true

      - name: Vitest (if configured)
        run: npx vitest run --passWithNoTests
        working-directory: apps/web
        continue-on-error: true
