[project]
name = "datask-worker"
version = "0.1.0"
description = "Datask Scrapling worker — RQ job processor"
requires-python = ">=3.12"
dependencies = [
    "datask-core",
    "rq>=1.16",
    "redis[hiredis]>=5.0",
    "scrapling[all]>=0.4.6",
    "openai>=1.30",
    "structlog>=24.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "psycopg2-binary>=2.9",
    "markdownify>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datask_worker"]
