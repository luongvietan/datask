[project]
name = "datask-api"
version = "0.1.0"
description = "Datask HTTP API — FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "datask-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "rq>=1.16",
    "stripe>=10.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "email-validator>=2.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "sentry-sdk[fastapi]>=2.0",
    "apscheduler>=3.10",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datask_api"]
