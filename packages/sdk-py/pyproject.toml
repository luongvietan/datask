[project]
name = "datask-py"
version = "0.1.0"
description = "Official Python SDK for Datask — Web Data API for AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["web-scraping", "ai", "agents", "cloudflare", "structured-data"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datask"]
