[project]
name = "datask-mcp"
version = "0.1.0"
description = "Datask MCP Server — expose datask_fetch and datask_extract as Claude/Cursor tools"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
datask-mcp = "datask_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datask_mcp"]
